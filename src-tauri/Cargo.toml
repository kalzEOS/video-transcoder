[package]
name = "video-transcoder"
version = "2.7.1"
description = "Video Transcoder - batch video encoder"
authors = ["claude.ai", "obelisk-complex"]
license = "GPL-3.0-or-later"
edition = "2021"
rust-version = "1.89"

[lib]
name = "video_transcoder_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "video-transcoder"
path = "src/main.rs"
required-features = ["custom-protocol"]

[[bin]]
name = "video-transcoder-cli"
path = "src/cli_main.rs"
required-features = ["cli"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"], optional = true }
tauri-plugin-dialog = { version = "2", optional = true }
tauri-plugin-notification = { version = "2", optional = true }
tauri-plugin-clipboard-manager = { version = "2", optional = true }
tauri-plugin-fs = { version = "2", optional = true }
tauri-plugin-shell = { version = "2", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "time", "sync", "io-util", "io-std", "test-util"] }
uuid = { version = "1", features = ["v4"], optional = true }
chrono = "0.4"
regex = "1"
reqwest = { version = "0.13", features = ["stream"], optional = true }
futures-util = { version = "0.3", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
indicatif = { version = "0.17", optional = true }
console = { version = "0.16", optional = true }
ctrlc = { version = "3", optional = true }
sha2 = "0.10"
tempfile = "3"
same-file = "1"
hdr10plus = { version = "~2.1.5", features = ["hevc", "json"] }

[features]
default = ["custom-protocol", "downloader"]
custom-protocol = [
    "tauri/custom-protocol",
    "dep:tauri",
    "dep:glib",
    "dep:tauri-plugin-dialog",
    "dep:tauri-plugin-notification",
    "dep:tauri-plugin-clipboard-manager",
    "dep:tauri-plugin-fs",
    "dep:tauri-plugin-shell",
    "dep:uuid",
]
downloader = ["dep:reqwest", "dep:futures-util"]
cli = ["dep:clap", "dep:indicatif", "dep:ctrlc", "dep:console"]

[dev-dependencies]
proptest = "1"
serial_test = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
glib = { version = "0.18", optional = true }
